name: Release
on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon macOS (M1/M2/M3/M4)
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin --bundles dmg,app'
          - platform: 'macos-13' # Intel x86_64 macOS
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin --bundles dmg,app'
          - platform: 'ubuntu-24.04' # Linux Ubuntu / Debian 24.04+ (.deb & .AppImage)
            target: 'x86_64-unknown-linux-gnu'
            args: '--bundles deb,appimage'
          - platform: 'windows-latest' # Windows (.exe installer & .msi)
            target: 'x86_64-pc-windows-msvc'
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu / Debian)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js and cache
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          CI: false
        with:
          tagName: v__VERSION__
          releaseName: "En Croissant 2.0 v__VERSION__"
          releaseBody: |
            # 🥐 En Croissant 2.0 (v__VERSION__)
            
            Cross-platform production release for Windows, macOS, and Linux (Ubuntu/Debian).
            
            ### Available Assets:
            - **Windows**: `.exe` (NSIS Installer) & `.msi`
            - **macOS**: `.dmg` & `.app` (Apple Silicon `aarch64` & Intel `x86_64`)
            - **Linux (Ubuntu / Debian)**: `.deb` & `.AppImage`
            
            *Maintained and developed by [Jai Kapoor](https://github.com/jaipkapoor99).*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
